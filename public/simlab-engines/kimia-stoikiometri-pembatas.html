<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulator Kimia: Stoikiometri &amp; Pereaksi Pembatas (2H₂ + O₂ → 2H₂O)</title>
  <style>
    :root { --bg:#f8fafc; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; border-bottom:1px solid var(--border); background:#fff; }
    header h1 { font-size:1.1rem; font-weight:800; color:#6d28d9; }
    header p { font-size:0.82rem; color:var(--muted); margin-top:2px; }
    main { flex:1; display:grid; grid-template-columns:minmax(340px,1.35fr) minmax(300px,1fr); gap:16px; padding:16px; }
    @media(max-width:900px){ main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; box-shadow:0 4px 12px rgba(15,23,42,0.04); }
    canvas { width:100%; background:#0f172a; border-radius:12px; display:block; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .s-box { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:10px; padding:10px; }
    .s-lbl { font-size:0.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .s-val { font-size:1rem; font-weight:800; margin-top:2px; font-family:monospace; }
  </style>
</head>
<body>
  <header>
    <h1>⚗️ Simulator Kimia: Stoikiometri &amp; Pereaksi Pembatas (2H₂ + O₂ → 2H₂O)</h1>
    <p>Lihat molekul mana yang habis duluan (Pereaksi Pembatas) dan berapa molekul yang tersisa!</p>
  </header>

  <main>
    <div class="card">
      <canvas id="stCanvas" width="760" height="390"></canvas>
    </div>

    <div class="card">
      <div class="stats">
        <div class="s-box"><div class="s-lbl">Produk H₂O</div><div class="s-val" id="vH2O" style="color:#0284c7">0 mol</div></div>
        <div class="s-box"><div class="s-lbl">Pereaksi Pembatas</div><div class="s-val" id="vLim" style="color:#e11d48">-</div></div>
        <div class="s-box"><div class="s-lbl">Zat Bersisa</div><div class="s-val" id="vRem" style="color:#d97706">-</div></div>
      </div>

      <div>
        <div style="display:flex;justify-content:space-between;font-size:0.84rem;font-weight:700;"><span>Jumlah Awal Mol H₂ (Putih-Biru)</span><span id="lblH2">6 mol</span></div>
        <input type="range" id="inH2" min="1" max="12" step="1" value="6" style="width:100%;accent-color:#38bdf8;cursor:pointer;">
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:0.84rem;font-weight:700;"><span>Jumlah Awal Mol O₂ (Merah)</span><span id="lblO2">2 mol</span></div>
        <input type="range" id="inO2" min="1" max="8" step="1" value="2" style="width:100%;accent-color:#f43f5e;cursor:pointer;">
      </div>
    </div>
  </main>

  <script>
    const c = document.getElementById('stCanvas'), ctx = c.getContext('2d');
    const inH2 = document.getElementById('inH2'), inO2 = document.getElementById('inO2');

    function draw() {
      const h2 = +inH2.value, o2 = +inO2.value;
      const rx = Math.min(h2 / 2, o2);
      const h2o = rx * 2;
      const remH2 = h2 - rx * 2, remO2 = o2 - rx;

      document.getElementById('lblH2').textContent = h2 + ' mol';
      document.getElementById('lblO2').textContent = o2 + ' mol';
      document.getElementById('vH2O').textContent = h2o + ' mol';
      document.getElementById('vLim').textContent = (h2/2 < o2) ? 'H₂ Habis' : ((o2 < h2/2) ? 'O₂ Habis' : 'Pas Habis');
      document.getElementById('vRem').textContent = remH2 > 0 ? `${remH2} mol H₂` : (remO2 > 0 ? `${remO2} mol O₂` : '0 (Habis)');

      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText('SEBELUM REAKSI (Reaktan)', 40, 35);
      ctx.fillText('SETELAH REAKSI (Produk H₂O + Sisa)', 400, 35);
      ctx.strokeStyle = '#334155'; ctx.beginPath(); ctx.moveTo(375, 20); ctx.lineTo(375, 370); ctx.stroke();

      // Gambar H2 awal
      for (let i = 0; i < h2; i++) {
        const x = 60 + (i % 4)*70, y = 75 + Math.floor(i/4)*55;
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI*2); ctx.arc(x+16, y, 10, 0, Math.PI*2); ctx.fill();
      }
      // Gambar O2 awal
      for (let i = 0; i < o2; i++) {
        const x = 60 + (i % 4)*70, y = 260 + Math.floor(i/4)*50;
        ctx.fillStyle = '#f43f5e';
        ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI*2); ctx.arc(x+20, y, 13, 0, Math.PI*2); ctx.fill();
      }

      // Gambar H2O hasil
      for (let i = 0; i < h2o; i++) {
        const x = 420 + (i % 4)*80, y = 85 + Math.floor(i/4)*65;
        ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath(); ctx.arc(x-13, y+10, 8, 0, Math.PI*2); ctx.arc(x+13, y+10, 8, 0, Math.PI*2); ctx.fill();
      }

      // Gambar Sisa
      ctx.fillStyle = '#fbbf24'; ctx.fillText('SISA TAK BEREAKSI:', 400, 290);
      for (let i = 0; i < remH2; i++) {
        const x = 420 + i*45, y = 325;
        ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2); ctx.arc(x+14, y, 9, 0, Math.PI*2); ctx.fill();
      }
      for (let i = 0; i < remO2; i++) {
        const x = 420 + i*55, y = 325;
        ctx.fillStyle = '#f43f5e'; ctx.beginPath(); ctx.arc(x, y, 12, 0, Math.PI*2); ctx.arc(x+18, y, 12, 0, Math.PI*2); ctx.fill();
      }
    }
    [inH2, inO2].forEach(el => el.oninput = draw);
    draw();
  </script>
</body>
</html>
