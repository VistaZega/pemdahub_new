<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulator Ekonomi &amp; Karier: Bunga Majemuk vs Bunga Tunggal</title>
  <style>
    :root { --bg:#f8fafc; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; border-bottom:1px solid var(--border); background:#fff; }
    header h1 { font-size:1.1rem; font-weight:800; color:#7c3aed; }
    main { flex:1; display:grid; grid-template-columns:minmax(340px,1.4fr) minmax(300px,1fr); gap:16px; padding:16px; }
    @media(max-width:900px){ main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    canvas { width:100%; background:#0f172a; border-radius:12px; display:block; }
    .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .s-box { background:#f1f5f9; border:1px solid #cbd5e1; border-radius:10px; padding:10px; }
    .s-lbl { font-size:0.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; }
    .s-val { font-size:1rem; font-weight:800; margin-top:2px; font-family:monospace; }
  </style>
</head>
<body>
  <header>
    <h1>💰 Simulator Literasi Keuangan: Kekuatan Bunga Majemuk (Compound Interest)</h1>
    <p style="font-size:0.82rem;color:#475569;">Bekal sukses karier &amp; finansial: bandingkan pertumbuhan investasi Bunga Majemuk (Hijau) vs Bunga Tunggal (Biru)!</p>
  </header>
  <main>
    <div class="card"><canvas id="finCanvas" width="760" height="390"></canvas></div>
    <div class="card">
      <div class="stats">
        <div class="s-box"><div class="s-lbl">Bunga Tunggal</div><div class="s-val" id="vSimp" style="color:#0284c7">Rp 0</div></div>
        <div class="s-box"><div class="s-lbl">Bunga Majemuk</div><div class="s-val" id="vComp" style="color:#059669">Rp 0</div></div>
      </div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Modal Awal</span><span id="lP">Rp 10 Juta</span></div><input type="range" id="inP" min="5" max="50" step="5" value="10" style="width:100%;"></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Imbal Hasil / Tahun (r)</span><span id="lR">10%</span></div><input type="range" id="inR" min="2" max="20" step="1" value="10" style="width:100%;"></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Lama Waktu (t)</span><span id="lT">15 Tahun</span></div><input type="range" id="inT" min="5" max="30" step="1" value="15" style="width:100%;"></div>
    </div>
  </main>
  <script>
    const c = document.getElementById('finCanvas'), ctx = c.getContext('2d');
    function draw() {
      const P = +document.getElementById('inP').value * 1000000;
      const r = +document.getElementById('inR').value / 100;
      const T = +document.getElementById('inT').value;
      document.getElementById('lP').textContent = `Rp ${P/1000000} Juta`;
      document.getElementById('lR').textContent = `${Math.round(r*100)}%`;
      document.getElementById('lT').textContent = `${T} Tahun`;

      const simpArr = [], compArr = [];
      for (let t = 0; t <= T; t++) {
        simpArr.push(P * (1 + r * t));
        compArr.push(P * Math.pow(1 + r, t));
      }
      document.getElementById('vSimp').textContent = 'Rp ' + Math.round(simpArr[T]/1000000) + ' Jt';
      document.getElementById('vComp').textContent = 'Rp ' + Math.round(compArr[T]/1000000) + ' Jt';

      ctx.clearRect(0,0,760,390);
      const maxV = compArr[T];
      const plot = (arr, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath();
        arr.forEach((v, i) => {
          const x = 50 + (i / T) * 660, y = 340 - (v / maxV) * 280;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
      };
      plot(simpArr, '#38bdf8');
      plot(compArr, '#34d399');
    }
    ['inP','inR','inT'].forEach(id=>document.getElementById(id).oninput=draw);
    draw();
  </script>
</body>
</html>
