<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulator Matematika: Transformasi Geometri 2D (Translasi, Rotasi, Dilatasi)</title>
  <style>
    :root { --bg:#f8fafc; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; border-bottom:1px solid var(--border); background:#fff; }
    header h1 { font-size:1.1rem; font-weight:800; color:#4f46e5; }
    main { flex:1; display:grid; grid-template-columns:minmax(340px,1.4fr) minmax(300px,1fr); gap:16px; padding:16px; }
    @media(max-width:900px){ main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    canvas { width:100%; background:#0f172a; border-radius:12px; display:block; }
  </style>
</head>
<body>
  <header>
    <h1>📐 Simulator Matematika: Transformasi Geometri (Translasi, Rotasi &amp; Dilatasi)</h1>
    <p style="font-size:0.82rem;color:#475569;">Dasar grafika komputer &amp; robotika: geser, putar, dan perbesar bangun segitiga biru menjadi bayangan hijau!</p>
  </header>
  <main>
    <div class="card"><canvas id="trCanvas" width="760" height="400"></canvas></div>
    <div class="card">
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Translasi X (dx)</span><span id="lDx">3</span></div><input type="range" id="dx" min="-6" max="6" value="3" style="width:100%;"></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Translasi Y (dy)</span><span id="lDy">2</span></div><input type="range" id="dy" min="-4" max="4" value="2" style="width:100%;"></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Rotasi Sudut (θ)</span><span id="lRot">45°</span></div><input type="range" id="rot" min="0" max="360" step="15" value="45" style="width:100%;"></div>
      <div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:0.84rem;"><span>Skala Dilatasi (k)</span><span id="lSc">1.5x</span></div><input type="range" id="sc" min="0.5" max="2.5" step="0.25" value="1.5" style="width:100%;"></div>
      <div id="coords" style="background:#f1f5f9;padding:12px;border-radius:12px;font-family:monospace;font-size:0.82rem;"></div>
    </div>
  </main>
  <script>
    const c = document.getElementById('trCanvas'), ctx = c.getContext('2d');
    const base = [[1,1],[3,1],[2,3]];
    function draw() {
      const dx=+document.getElementById('dx').value, dy=+document.getElementById('dy').value,
            rot=+document.getElementById('rot').value, k=+document.getElementById('sc').value;
      document.getElementById('lDx').textContent=dx; document.getElementById('lDy').textContent=dy;
      document.getElementById('lRot').textContent=rot+'°'; document.getElementById('lSc').textContent=k+'x';

      const rad = rot * Math.PI / 180;
      const trans = base.map(([x,y]) => {
        const sx = x*k, sy = y*k;
        return [sx*Math.cos(rad) - sy*Math.sin(rad) + dx, sx*Math.sin(rad) + sy*Math.cos(rad) + dy];
      });
      document.getElementById('coords').innerHTML = 'Bayangan: ' + trans.map((p,i)=>`P${i+1}'(${p[0].toFixed(1)}, ${p[1].toFixed(1)})`).join(' | ');

      ctx.clearRect(0,0,760,400);
      const ox=380, oy=200, u=28;
      ctx.strokeStyle='#1e293b'; ctx.lineWidth=1;
      for(let i=-13;i<=13;i++){ctx.beginPath();ctx.moveTo(ox+i*u,0);ctx.lineTo(ox+i*u,400);ctx.stroke();}
      for(let j=-7;j<=7;j++){ctx.beginPath();ctx.moveTo(0,oy+j*u);ctx.lineTo(760,oy+j*u);ctx.stroke();}
      ctx.strokeStyle='#64748b'; ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(0,oy);ctx.lineTo(760,oy);ctx.moveTo(ox,0);ctx.lineTo(ox,400);ctx.stroke();

      const drawPoly = (pts, col) => {
        ctx.fillStyle=col; ctx.beginPath();
        pts.forEach(([x,y],i)=> i===0?ctx.moveTo(ox+x*u,oy-y*u):ctx.lineTo(ox+x*u,oy-y*u));
        ctx.closePath(); ctx.fill();
      };
      drawPoly(base, 'rgba(56,189,248,0.65)');
      drawPoly(trans, 'rgba(52,211,153,0.75)');
    }
    ['dx','dy','rot','sc'].forEach(id=>document.getElementById(id).oninput=draw);
    draw();
  </script>
</body>
</html>
