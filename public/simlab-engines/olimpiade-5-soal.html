<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lab Khusus: 5 Soal Olimpiade Sains Internasional &amp; Pembuktian Visual</title>
  <style>
    :root { --bg:#f8fafc; --panel:#ffffff; --border:#cbd5e1; --text:#0f172a; --muted:#475569; }
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
    body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
    header { padding:14px 20px; border-bottom:1px solid var(--border); background: #ffffff; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; }
    header h1 { font-size:1.15rem; font-weight:800; color:#b45309; }
    header p { font-size:0.82rem; color:var(--muted); }
    .tabs { display:flex; flex-wrap:wrap; gap:8px; padding:12px 20px; background:#fff; border-bottom:1px solid var(--border); }
    .tab-btn { border:1px solid #cbd5e1; background:#f8fafc; color:#334155; padding:8px 14px; border-radius:10px; font-weight:700; font-size:0.82rem; cursor:pointer; transition:0.15s; }
    .tab-btn.active { background:#f59e0b; color:#451a03; border-color:#d97706;  }
    main { flex:1; display:grid; grid-template-columns:minmax(340px,1.35fr) minmax(320px,1fr); gap:16px; padding:16px; }
    @media(max-width: 100%){ main { grid-template-columns:1fr; } }
    .card { background:var(--panel); border:1px solid var(--border); border-radius: 6px; padding:16px; display:flex; flex-direction:column; gap:12px;  }
    canvas { width:100%; background:#0f172a; border-radius: 6px; display:block; }
    .soal-badge { display:inline-block; padding:4px 10px; border-radius: 4px; font-size:0.75rem; font-weight:800; background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
    .answer-box { background:#ecfdf5; border:1px solid #a7f3d0; border-radius: 6px; padding:14px; font-size:0.85rem; line-height:1.55; color:#065f46; }
    .ctrl-box { background:#f1f5f9; border:1px solid #cbd5e1; border-radius: 6px; padding:12px; display:flex; flex-direction:column; gap:10px; }
    button.act { border:none; border-radius:10px; padding:10px 14px; font-weight:700; font-size:0.84rem; cursor:pointer; background:#0f172a; color:#fff; }
    button.act:hover { background:#0284c7; }
  </style>
  <link rel="stylesheet" href="simlab-theme.css" />
</head>
<body>
  <header>
    <div><h1>Lab Tantangan 5 Soal Olimpiade Sains Internasional</h1>
      <p>Pecahkan 5 soal klasik IPhO, IMO, IChO, IBO &amp; IOI — ubah variabelnya dan lihat pembuktian visualnya langsung!</p>
    </div>
  </header>

  <div class="tabs"><button class="tab-btn active" onclick="selectProblem(0, this)">1. Fisika (IPhO): Meriam Galileo</button>
    <button class="tab-btn" onclick="selectProblem(1, this)">2. Matematika (IMO): Paradoks Ulang Tahun</button>
    <button class="tab-btn" onclick="selectProblem(2, this)">3. Kimia (IChO): Kesetimbangan Le Chatelier</button>
    <button class="tab-btn" onclick="selectProblem(3, this)">4. Biologi (IBO): Genetika Hardy-Weinberg</button>
    <button class="tab-btn" onclick="selectProblem(4, this)">5. Informatika (IOI): Binary vs Linear Search</button>
  </div>

  <main>
    <div class="card"><canvas id="olyCanvas" width="760" height="410"></canvas>
      <div id="liveMetrics" style="font-family:monospace;font-size:0.88rem;font-weight:700;color:#0369a1;"></div>
    </div>

    <div class="card"><div><span class="soal-badge" id="pBadge">IPhO</span>
        <h2 id="pTitle" style="font-size:1.1rem;font-weight:800;margin-top:8px;"></h2>
        <p id="pQuestion" style="font-size:0.88rem;color:#334155;line-height:1.55;margin-top:6px;"></p>
      </div>

      <div class="ctrl-box" id="pControls"></div>

      <div class="answer-box"><strong>Pembahasan &amp; Pembuktian Jawaban:</strong>
        <p id="pAnswer" style="margin-top:6px;"></p>
      </div>
    </div>
  </main>

  <script>
    const c = document.getElementById('olyCanvas'), ctx = c.getContext('2d');
    let cur = 0;

    // State Soal 1 (IPhO: Tumbukan 2 Bola - Galileo Cannon)
    let p1 = { active:false, yBig:80, vBig:0, ySmall:50, vSmall:0, mRatio:10, maxH:50 };
    // State Soal 2 (IMO: Birthday Paradox)
    let p2 = { n:23, trials:0, matches:0 };
    // State Soal 3 (IChO: N2O4 <-> 2NO2)
    let p3 = { temp:25, press:1 };
    // State Soal 4 (IBO: Hardy-Weinberg)
    let p4 = { p:0.6 };
    // State Soal 5 (IOI: Binary vs Linear Search)
    let p5 = { target:73, stepBin:0, stepLin:0, lo:1, hi:100, mid:50, linIdx:1, done:false };

    const problems = [
      {
        badge: 'Olimpiade Fisika (IPhO)',
        title: 'Mengapa Bola Kecil di Atas Bola Besar Memantul Jauh Lebih Tinggi? (Galileo Cannon)',
        q: 'Sebuah bola tenis (m₁) diletakkan tepat di atas bola basket (m₂ ≫ m₁) lalu dijatuhkan bersamaan dari ketinggian h. Mengapa bola tenis bisa memantul hingga hampir 9× tinggi semula?',
        ans: 'Saat bola besar memantul dari lantai dengan kecepatan v ke atas, ia bertumbukan elastis dengan bola kecil yang masih jatuh dengan kecepatan v ke bawah. Dalam kerangka bola besar, bola kecil berbalik dengan kecepatan 2v, sehingga terhadap tanah kecepatannya menjadi v + 2v = 3v! Karena tinggi pantulan h ∝ v², tingginya menjadi 3² = 9 kali lipat!',
        controls: () => `
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Rasio Massa (m₂ / m₁)</span><span id="lblM">${p1.mRatio}x</span></div>
          <input type="range" min="1" max="20" value="${p1.mRatio}" oninput="p1.mRatio=+this.value;document.getElementById('lblM').textContent=this.value+'x'">
          <button class="act" onclick="p1={active:true,yBig:120,vBig:0,ySmall:88,vSmall:0,mRatio:p1.mRatio,maxH:88}">Jatuhkan Kedua Bola Sekarang!</button>
        `
      },
      {
        badge: 'Olimpiade Matematika (IMO)',
        title: 'Paradoks Ulang Tahun: Mengapa Cukup 23 Orang untuk Peluang >50%?',
        q: 'Dalam satu ruangan hanya ada 23 orang (padahal setahun ada 365 hari). Mengapa peluang minimal 2 orang berulang tahun sama sudah lebih dari 50%?',
        ans: 'Kuncinya bukan membandingkan 1 orang dengan 22 lainnya, melainkan menghitung PASANGAN yang terbentuk: C(23,2) = 253 pasangan! Peluang semua berbeda adalah (365/365)×(364/365)×...×(343/365) ≈ 49,27%. Jadi peluang ada yang sama = 1 − 49,27% = 50,73%!',
        controls: () => `
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Jumlah Orang di Ruangan (n)</span><span id="lblN">${p2.n} Orang</span></div>
          <input type="range" min="5" max="60" value="${p2.n}" oninput="p2.n=+this.value;document.getElementById('lblN').textContent=this.value+' Orang'">
          <button class="act" onclick="runMonteCarlo()">Uji 100 Simulasi Acak Ruangan!</button>
        `
      },
      {
        badge: 'Olimpiade Kimia (IChO)',
        title: 'Kesetimbangan Gas N₂O₄ (Bening) ⇌ 2 NO₂ (Coklat Merah) + Kalor',
        q: 'Reaksi N₂O₄(g) ⇌ 2 NO₂(g) bersifat endoterm (ΔH > 0). Apa yang terjadi pada warna tabung jika suhu dinaikkan atau tekanan diperbesar?',
        ans: 'Sesuai Prinsip Le Chatelier: (1) Jika suhu naik, kesetimbangan bergeser ke kanan (endoterm) membentuk lebih banyak NO₂ coklat pekat. (2) Jika tekanan naik (volume mengecil), kesetimbangan bergeser ke jumlah mol gas lebih kecil (kiri → N₂O₄ bening)!',
        controls: () => `
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Suhu Tabung</span><span id="lblT3">${p3.temp}°C</span></div>
          <input type="range" min="0" max="100" value="${p3.temp}" oninput="p3.temp=+this.value;document.getElementById('lblT3').textContent=this.value+'°C'">
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Tekanan Piston</span><span id="lblP3">${p3.press} atm</span></div>
          <input type="range" min="1" max="5" step="0.5" value="${p3.press}" oninput="p3.press=+this.value;document.getElementById('lblP3').textContent=this.value+' atm'">
        `
      },
      {
        badge: 'Olimpiade Biologi (IBO)',
        title: 'Hukum Hardy-Weinberg: Frekuensi Genotipe AA, Aa, dan aa',
        q: 'Jika frekuensi alel dominan A adalah p = 0,6 dalam populasi seimbang, berapakah persentase individu pembawa sifat (heterozigot Aa) dan resesif (aa)?',
        ans: 'Karena p + q = 1, maka q = 1 − 0,6 = 0,4. Sesuai ekspansi (p + q)² = p² + 2pq + q² = 1: AA = (0,6)² = 36%, Aa = 2(0,6)(0,4) = 48%, dan aa = (0,4)² = 16%!',
        controls: () => `
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Frekuensi Alel Dominan (p)</span><span id="lblP4">${p4.p.toFixed(2)}</span></div>
          <input type="range" min="0.1" max="0.9" step="0.05" value="${p4.p}" oninput="p4.p=+this.value;document.getElementById('lblP4').textContent=p4.p.toFixed(2)">
        `
      },
      {
        badge: 'Olimpiade Informatika (IOI)',
        title: 'Mengapa Binary Search Hanya Butuh ≤7 Langkah Mencari di 100 Data?',
        q: 'Anda harus menebak angka rahasia antara 1 hingga 100. Mengapa pencarian biner (Binary Search) jauh lebih cepat daripada mengecek satu per satu (Linear Search)?',
        ans: 'Setiap kali menebak titik tengah, Binary Search langsung membuang SEPARUH ruang pencarian (100 → 50 → 25 → 13 → 7 → 4 → 2 → 1). Jadi maksimal hanya butuh ⌈log₂(100)⌉ = 7 langkah, sedangkan Linear Search bisa sampai 100 langkah!',
        controls: () => `
          <div style="display:flex;justify-content:space-between;font-size:0.82rem;font-weight:700;"><span>Angka Target (1–100)</span><span id="lblT5">${p5.target}</span></div>
          <input type="range" min="1" max="100" value="${p5.target}" oninput="p5.target=+this.value;document.getElementById('lblT5').textContent=this.value">
          <button class="act" onclick="stepSearch()">Jalankan 1 Langkah Pencarian (Binary vs Linear)</button>
          <button class="act" style="background:#475569" onclick="p5={target:p5.target,stepBin:0,stepLin:0,lo:1,hi:100,mid:50,linIdx:1,done:false}">↺ Reset Pencarian</button>
        `
      }
    ];

    function runMonteCarlo() {
      p2.trials = 100; p2.matches = 0;
      for (let t = 0; t < 100; t++) {
        const seen = new Set(); let dup = false;
        for (let i = 0; i < p2.n; i++) {
          const d = Math.floor(Math.random() * 365);
          if (seen.has(d)) { dup = true; break; }
          seen.add(d);
        }
        if (dup) p2.matches++;
      }
    }

    function stepSearch() {
      if (p5.done) return;
      p5.stepBin++; p5.stepLin++;
      p5.mid = Math.floor((p5.lo + p5.hi) / 2);
      if (p5.mid === p5.target) p5.done = true;
      else if (p5.mid < p5.target) p5.lo = p5.mid + 1;
      else p5.hi = p5.mid - 1;
      p5.linIdx = Math.min(100, p5.linIdx + 1);
    }

    function selectProblem(idx, btn) {
      cur = idx;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      const pr = problems[idx];
      document.getElementById('pBadge').textContent = pr.badge;
      document.getElementById('pTitle').textContent = pr.title;
      document.getElementById('pQuestion').textContent = pr.q;
      document.getElementById('pAnswer').textContent = pr.ans;
      document.getElementById('pControls').innerHTML = pr.controls();
    }

    function loop() {
      ctx.clearRect(0, 0, c.width, c.height);
      const met = document.getElementById('liveMetrics');

      if (cur === 0) {
        const floor = 370;
        ctx.fillStyle = '#334155'; ctx.fillRect(0, floor, c.width, 40);
        if (p1.active) {
          p1.vBig += 0.35; p1.vSmall += 0.35;
          p1.yBig += p1.vBig; p1.ySmall += p1.vSmall;
          if (p1.yBig >= floor - 28) { p1.yBig = floor - 28; p1.vBig = -Math.abs(p1.vBig) * 0.92; }
          if (p1.ySmall >= p1.yBig - 38) {
            p1.ySmall = p1.yBig - 38;
            const boost = 1 + (2 * p1.mRatio) / (1 + p1.mRatio);
            p1.vSmall = -Math.abs(p1.vBig) * boost;
          }
          if (p1.ySmall < p1.maxH) p1.maxH = p1.ySmall;
        }
        ctx.fillStyle = '#f97316'; ctx.beginPath(); ctx.arc(380, p1.yBig, 28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#a3e635'; ctx.beginPath(); ctx.arc(380, p1.ySmall, 11, 0, Math.PI*2); ctx.fill();
        met.textContent = `Rasio Massa: ${p1.mRatio}:1 | Puncak Tertinggi Bola Kecil: ${Math.round(370 - p1.maxH)} px`;
      }
      else if (cur === 1) {
        let probDiff = 1;
        for (let i = 0; i < p2.n; i++) probDiff *= (365 - i) / 365;
        const probSame = (1 - probDiff) * 100;
        ctx.fillStyle = '#1e293b'; ctx.fillRect(60, 120, 640, 45);
        ctx.fillStyle = probSame >= 50 ? '#10b981' : '#38bdf8';
        ctx.fillRect(60, 120, 6.4 * probSame, 45);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`Peluang Teoritis Ada Ulang Tahun Sama: ${probSame.toFixed(2)}%`, 380, 95);
        ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 16px sans-serif';
        ctx.fillText(`Jumlah Pasangan Orang: ${p2.n * (p2.n - 1) / 2} pasangan`, 380, 220);
        if (p2.trials > 0) ctx.fillText(`Hasil Uji 100 Ruangan Acak: ${p2.matches}% Ruangan Memiliki Ulang Tahun Sama!`, 380, 265);
        met.textContent = `n = ${p2.n} orang | Peluang Teoritis = ${probSame.toFixed(2)}%`;
      }
      else if (cur === 2) {
        const ratioNO2 = Math.min(0.95, Math.max(0.08, (p3.temp / 110) / Math.sqrt(p3.press)));
        ctx.fillStyle = `rgba(180, 83, 9, ${ratioNO2})`;
        ctx.fillRect(250, 90 + (p3.press - 1)*22, 260, 260 - (p3.press - 1)*22);
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 4;
        ctx.strokeRect(250, 90, 260, 260);
        ctx.fillStyle = '#e2e8f0'; ctx.fillRect(252, 80 + (p3.press - 1)*22, 256, 14);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`Dominan: ${ratioNO2 > 0.5 ? '2 NO₂ (Coklat Pekat)' : 'N₂O₄ (Lebih Bening)'}`, 380, 380);
        met.textContent = `Suhu: ${p3.temp}°C | Tekanan: ${p3.press} atm | Fraksi NO₂: ${Math.round(ratioNO2*100)}%`;
      }
      else if (cur === 3) {
        const p = p4.p, q = 1 - p;
        const aa = p*p*100, Aa = 2*p*q*100, rr = q*q*100;
        [[140, aa, '#38bdf8', `AA (${aa.toFixed(1)}%)`], [320, Aa, '#34d399', `Aa (${Aa.toFixed(1)}%)`], [500, rr, '#f43f5e', `aa (${rr.toFixed(1)}%)`]].forEach(([x, val, col, lbl]) => {
          const h = val * 2.8;
          ctx.fillStyle = col; ctx.fillRect(x, 340 - h, 110, h);
          ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(lbl, x + 55, 365);
        });
        met.textContent = `p = ${p.toFixed(2)}, q = ${q.toFixed(2)} | Total p² + 2pq + q² = 100%`;
      }
      else if (cur === 4) {
        const w = 6.8;
        for (let i = 1; i <= 100; i++) {
          let col = '#1e293b';
          if (i >= p5.lo && i <= p5.hi) col = '#0284c7';
          if (i === p5.mid) col = '#fbbf24';
          if (i === p5.target) col = '#10b981';
          ctx.fillStyle = col;
          ctx.fillRect(40 + (i-1)*w, 130, w - 1.5, 60);
        }
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(`Binary Search: Langkah ke-${p5.stepBin} (Tebakan Tengah = ${p5.mid}, Target = ${p5.target})`, 380, 95);
        ctx.fillStyle = '#94a3b8';
        ctx.fillText(`Linear Search baru memeriksa hingga kotak ke-${p5.linIdx} (butuh ${p5.target} langkah)`, 380, 240);
        met.textContent = p5.done ? ` Ditemukan oleh Binary Search hanya dalam ${p5.stepBin} langkah!` : `Rentang Aktif Binary Search: [${p5.lo} .. ${p5.hi}]`;
      }
      requestAnimationFrame(loop);
    }

    selectProblem(0, document.querySelector('.tab-btn'));
    loop();
  </script>
</body>
</html>
