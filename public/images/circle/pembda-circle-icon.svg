<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="pembda-circle-svg">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="pcBgGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#0e1e38" />
            <stop offset="60%" stop-color="#081022" />
            <stop offset="100%" stop-color="#050a16" />
        </radialGradient>
        
        <!-- Cyan Neon Gradient -->
        <linearGradient id="pcCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#22d3ee" />
            <stop offset="100%" stop-color="#00e5ff" />
        </linearGradient>

        <!-- Blue Neon Gradient -->
        <linearGradient id="pcBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>

        <!-- Amber Neon Gradient -->
        <linearGradient id="pcAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fde047" />
            <stop offset="100%" stop-color="#f59e0b" />
        </linearGradient>

        <!-- Glow Filters -->
        <filter id="pcGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="pcGlowAmber" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <style>
            @keyframes pcOrbitCw {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
            @keyframes pcOrbitCcw {
                0% { transform: rotate(360deg); }
                100% { transform: rotate(0deg); }
            }
            @keyframes pcPulseCore {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.02); }
            }
            @keyframes pcTwinkle {
                0%, 100% { opacity: 0.25; transform: scale(0.8); }
                50% { opacity: 0.95; transform: scale(1.3); }
            }
            .pc-orbit-cyan {
                transform-origin: 120px 120px;
                animation: pcOrbitCw 7s linear infinite;
            }
            .pc-orbit-blue {
                transform-origin: 120px 120px;
                animation: pcOrbitCw 9s linear infinite;
            }
            .pc-orbit-amber {
                transform-origin: 120px 120px;
                animation: pcOrbitCw 12s linear infinite;
            }
            .pc-core-c {
                transform-origin: 120px 120px;
                animation: pcPulseCore 3s ease-in-out infinite;
            }
            .pc-star-1 { transform-origin: 40px 60px; animation: pcTwinkle 2.4s ease-in-out infinite; }
            .pc-star-2 { transform-origin: 200px 70px; animation: pcTwinkle 3.1s ease-in-out infinite 0.7s; }
            .pc-star-3 { transform-origin: 205px 170px; animation: pcTwinkle 2.8s ease-in-out infinite 1.2s; }
            .pc-star-4 { transform-origin: 50px 180px; animation: pcTwinkle 3.5s ease-in-out infinite 0.3s; }
            .pc-star-5 { transform-origin: 120px 30px; animation: pcTwinkle 2.1s ease-in-out infinite 1.5s; }
            .pc-star-6 { transform-origin: 120px 210px; animation: pcTwinkle 2.9s ease-in-out infinite 0.9s; }
        </style>
    </defs>

    <!-- Deep Space Rounded Container / Background -->
    <rect width="240" height="240" rx="48" fill="url(#pcBgGlow)" />
    
    <!-- Ambient Ring Guide -->
    <circle cx="120" cy="120" r="92" stroke="#1e293b" stroke-width="1.8" stroke-dasharray="3 5" opacity="0.4" />
    <circle cx="120" cy="120" r="76" stroke="#0f172a" stroke-width="1.5" opacity="0.6" />

    <!-- Stardust Floating Particles -->
    <circle cx="40" cy="60" r="1.5" fill="#38bdf8" class="pc-star-1" />
    <circle cx="200" cy="70" r="1.8" fill="#38bdf8" class="pc-star-2" />
    <circle cx="205" cy="170" r="1.6" fill="#60a5fa" class="pc-star-3" />
    <circle cx="50" cy="180" r="1.4" fill="#fbbf24" class="pc-star-4" />
    <circle cx="120" cy="30" r="1.6" fill="#22d3ee" class="pc-star-5" />
    <circle cx="120" cy="210" r="1.5" fill="#38bdf8" class="pc-star-6" />

    <!-- 1. Outer Cyan Orbiting Arc -->
    <g class="pc-orbit-cyan">
        <path d="M 120,28 A 92,92 0 0,1 210,140" fill="none" stroke="url(#pcCyanGrad)" stroke-width="5.5" stroke-linecap="round" filter="url(#pcGlowCyan)" />
        <circle cx="210" cy="140" r="5" fill="#00e5ff" filter="url(#pcGlowCyan)" />
    </g>

    <!-- 2. Middle Blue Orbiting Arc -->
    <g class="pc-orbit-blue">
        <path d="M 197,120 A 77,77 0 0,1 110,196" fill="none" stroke="url(#pcBlueGrad)" stroke-width="5" stroke-linecap="round" />
        <circle cx="110" cy="196" r="4.5" fill="#3b82f6" />
    </g>

    <!-- 3. Inner Amber Orbiting Arc -->
    <g class="pc-orbit-amber">
        <path d="M 76,76 A 62,62 0 0,1 164,76" fill="none" stroke="url(#pcAmberGrad)" stroke-width="4.8" stroke-linecap="round" filter="url(#pcGlowAmber)" />
        <circle cx="164" cy="76" r="4.5" fill="#f59e0b" filter="url(#pcGlowAmber)" />
    </g>

    <!-- Center Monogram "C" -->
    <g class="pc-core-c">
        <!-- White C Curve -->
        <path d="M 152,86 A 44,44 0 1,0 152,154" fill="none" stroke="#ffffff" stroke-width="19" stroke-linecap="round" />
        <!-- Accent Dot at terminal -->
        <circle cx="157" cy="146" r="6" fill="#f59e0b" filter="url(#pcGlowAmber)" />
    </g>
</svg>
