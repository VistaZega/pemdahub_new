<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" class="pembda-circle-pastel-svg">
    <defs>
        <!-- Soft Pastel Multi-glow Background -->
        <radialGradient id="pcPastelBg" cx="40%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="45%" stop-color="#fdf2f8" />
            <stop offset="75%" stop-color="#f0f9ff" />
            <stop offset="100%" stop-color="#fefce8" />
        </radialGradient>

        <!-- Pastel Rose/Pink Orbit Gradient -->
        <linearGradient id="pcPastelRose" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f43f5e" />
            <stop offset="50%" stop-color="#fb7185" />
            <stop offset="100%" stop-color="#f472b6" />
        </linearGradient>

        <!-- Pastel Sky/Cyan Orbit Gradient -->
        <linearGradient id="pcPastelSky" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#0284c7" />
            <stop offset="50%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#2dd4bf" />
        </linearGradient>

        <!-- Pastel Golden Amber Orbit Gradient -->
        <linearGradient id="pcPastelAmber" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#d97706" />
            <stop offset="50%" stop-color="#f59e0b" />
            <stop offset="100%" stop-color="#fbbf24" />
        </linearGradient>

        <!-- Pastel Mint Orbit Gradient -->
        <linearGradient id="pcPastelMint" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#059669" />
            <stop offset="100%" stop-color="#34d399" />
        </linearGradient>

        <!-- Center "C" Vibrant Pastel Gradient -->
        <linearGradient id="pcCenterCGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ec4899" />
            <stop offset="45%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <!-- Soft Drop Shadow for Beads & Elements -->
        <filter id="pcPastelGlowRose" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f43f5e" flood-opacity="0.35" />
        </filter>
        <filter id="pcPastelGlowSky" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0284c7" flood-opacity="0.35" />
        </filter>
        <filter id="pcPastelGlowAmber" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.4" />
        </filter>
        <filter id="pcCardShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f472b6" flood-opacity="0.18" />
        </filter>

        <style>
            @keyframes pcSpinCw {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            @keyframes pcSpinCcw {
                from { transform: rotate(360deg); }
                to { transform: rotate(0deg); }
            }
            @keyframes pcPulseSoft {
                0%, 100% { transform: scale(1); }
                50% { transform: scale(1.03); }
            }
            @keyframes pcTwinkleStar {
                0%, 100% { opacity: 0.35; transform: scale(0.85); }
                50% { opacity: 1; transform: scale(1.25); }
            }
            .pc-rot-sky {
                transform-origin: 120px 120px;
                animation: pcSpinCw 9s linear infinite;
            }
            .pc-rot-rose {
                transform-origin: 120px 120px;
                animation: pcSpinCcw 7s linear infinite;
            }
            .pc-rot-amber {
                transform-origin: 120px 120px;
                animation: pcSpinCw 11s linear infinite;
            }
            .pc-center-core {
                transform-origin: 120px 120px;
                animation: pcPulseSoft 3.5s ease-in-out infinite;
            }
            .pc-tw-1 { transform-origin: 45px 50px; animation: pcTwinkleStar 2.2s ease-in-out infinite; }
            .pc-tw-2 { transform-origin: 195px 65px; animation: pcTwinkleStar 2.9s ease-in-out infinite 0.6s; }
            .pc-tw-3 { transform-origin: 200px 175px; animation: pcTwinkleStar 2.5s ease-in-out infinite 1.1s; }
            .pc-tw-4 { transform-origin: 40px 175px; animation: pcTwinkleStar 3.2s ease-in-out infinite 0.3s; }
        </style>
    </defs>

    <!-- Outer Card / Orb Background (Soft Pastel Glassmorphic) -->
    <rect width="240" height="240" rx="52" fill="url(#pcPastelBg)" stroke="#fbcfe8" stroke-width="2.5" filter="url(#pcCardShadow)" />

    <!-- Ambient Subtle Guide Rings (Pastel) -->
    <circle cx="120" cy="120" r="92" stroke="#fbcfe8" stroke-width="1.8" stroke-dasharray="4 6" opacity="0.65" />
    <circle cx="120" cy="120" r="77" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.8" />
    <circle cx="120" cy="120" r="62" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.7" />

    <!-- Twinkling Floating Pastel Sparkles -->
    <!-- Star 1: Pastel Rose -->
    <g class="pc-tw-1">
        <path d="M 45,44 Q 45,50 39,50 Q 45,50 45,56 Q 45,50 51,50 Q 45,50 45,44 Z" fill="#f43f5e" opacity="0.8" />
    </g>
    <!-- Star 2: Pastel Sky -->
    <g class="pc-tw-2">
        <circle cx="195" cy="65" r="3" fill="#38bdf8" filter="url(#pcPastelGlowSky)" />
    </g>
    <!-- Star 3: Pastel Amber -->
    <g class="pc-tw-3">
        <path d="M 200,169 Q 200,175 194,175 Q 200,175 200,181 Q 200,175 206,175 Q 200,175 200,169 Z" fill="#fbbf24" opacity="0.85" />
    </g>
    <!-- Star 4: Pastel Mint -->
    <g class="pc-tw-4">
        <circle cx="40" cy="175" r="2.8" fill="#34d399" />
    </g>

    <!-- 1. Outer Orbit (Pastel Sky / Cyan & Turquoise) -->
    <g class="pc-rot-sky">
        <path d="M 120,28 A 92,92 0 0,1 210,138" fill="none" stroke="url(#pcPastelSky)" stroke-width="6" stroke-linecap="round" filter="url(#pcPastelGlowSky)" />
        <!-- Head Bead with highlight reflection -->
        <circle cx="210" cy="138" r="6" fill="#0284c7" filter="url(#pcPastelGlowSky)" />
        <circle cx="208.5" cy="136.5" r="2" fill="#ffffff" opacity="0.8" />
    </g>

    <!-- 2. Middle Orbit (Pastel Rose / Pink & Coral, Counter-Clockwise) -->
    <g class="pc-rot-rose">
        <path d="M 195,120 A 77,77 0 0,1 106,195" fill="none" stroke="url(#pcPastelRose)" stroke-width="5.5" stroke-linecap="round" filter="url(#pcPastelGlowRose)" />
        <circle cx="106" cy="195" r="5.5" fill="#f43f5e" filter="url(#pcPastelGlowRose)" />
        <circle cx="104.5" cy="193.5" r="1.8" fill="#ffffff" opacity="0.85" />
    </g>

    <!-- 3. Inner Orbit (Pastel Golden Amber Sun) -->
    <g class="pc-rot-amber">
        <path d="M 76,76 A 62,62 0 0,1 164,76" fill="none" stroke="url(#pcPastelAmber)" stroke-width="5" stroke-linecap="round" filter="url(#pcPastelGlowAmber)" />
        <circle cx="164" cy="76" r="5" fill="#f59e0b" filter="url(#pcPastelGlowAmber)" />
        <circle cx="162.5" cy="74.5" r="1.6" fill="#ffffff" opacity="0.9" />
    </g>

    <!-- Center Iconic "C" Monogram -->
    <g class="pc-center-core">
        <!-- Inner Glow Badge behind C -->
        <circle cx="120" cy="120" r="36" fill="#ffffff" opacity="0.9" />
        
        <!-- Bold Styled C Curve in Vibrant Gradient -->
        <path d="M 148,90 A 40,40 0 1,0 148,150" fill="none" stroke="url(#pcCenterCGrad)" stroke-width="17" stroke-linecap="round" />
        
        <!-- Inner White Core Highlight inside the stroke for glossy 3D effect -->
        <path d="M 144,93 A 38,38 0 1,0 144,147" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

        <!-- Accent Pearl Bead at terminal of C (Golden Amber) -->
        <circle cx="154" cy="143" r="6.5" fill="#fbbf24" filter="url(#pcPastelGlowAmber)" />
        <circle cx="152" cy="141" r="2.2" fill="#ffffff" opacity="0.95" />
    </g>
</svg>
