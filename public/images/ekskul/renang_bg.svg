        <circle cx="480" cy="160" r="28" />
        <!-- Swimmer Swimming Cap & Goggles -->
        <path d="M460 145 C470 135, 500 135, 508 150 C505 160, 490 168, 475 168 Z" opacity="0.8" />
        
        <!-- Swimmer Body & Arms (Freestyle / Crawl Stroke) -->
        <path d="M460 170 C410 180, 320 200, 240 210 C200 215, 150 205, 120 220 C100 230, 80 260, 70 275 C65 282, 75 290, 85 285 C105 270, 130 250, 170 240 C230 230, 310 215, 380 200 C410 195, 450 185, 470 178 Z" />
        
