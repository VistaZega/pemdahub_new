        <path d="M0 260 Q80 240, 160 260 T320 260 T480 250 T640 260 L640 275 Q480 265, 320 275 T160 275 T0 275 Z" opacity="0.9" />
        <path d="M40 290 Q120 275, 200 290 T360 290 T520 280 T640 290 L640 302 Q520 292, 360 302 T200 302 T40 302 Z" opacity="0.6" />
        <path d="M100 320 Q180 305, 260 320 T420 320 T580 310 T640 320 L640 330 Q580 320, 420 330 T260 330 T100 330 Z" opacity="0.4" />
        
        <!-- Water Droplets Splash -->
        <circle cx="530" cy="130" r="6" opacity="0.7" />
        <circle cx="560" cy="110" r="4" opacity="0.8" />
        <circle cx="310" cy="100" r="5" opacity="0.7" />
        <circle cx="280" cy="70" r="4" opacity="0.6" />
        <circle cx="70" cy="180" r="5" opacity="0.8" />
        <circle cx="45" cy="170" r="4" opacity="0.7" />
